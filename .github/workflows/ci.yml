name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: prerenderbuddy/engine:ci
      - name: Smoke test container
        run: |
          PRERENDER_SMOKE_TOKEN="$(node -e "process.stdout.write('x'.repeat(32))")"
          docker run --detach --name engine \
            --env PRERENDER_TOKEN="$PRERENDER_SMOKE_TOKEN" \
            --env ALLOWED_DOMAINS=example.com \
            --publish 127.0.0.1:3000:3000 \
            --shm-size=1g \
            prerenderbuddy/engine:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs engine
          exit 1
