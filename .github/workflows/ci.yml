name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build browser integration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: test
          load: true
          push: false
          tags: prerenderbuddy/engine:test
      - name: Run real Chromium fixture matrix
        run: docker run --rm --shm-size=1g prerenderbuddy/engine:test
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: prerenderbuddy/engine:ci
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prerenderbuddy/engine:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Smoke test container
        run: |
          PRERENDER_SMOKE_TOKEN="$(node -e "process.stdout.write('x'.repeat(32))")"
          trap 'docker rm --force engine >/dev/null 2>&1 || true' EXIT
          docker run --detach --name engine \
            --env PRERENDER_TOKEN="$PRERENDER_SMOKE_TOKEN" \
            --env ALLOWED_DOMAINS=example.com \
            --publish 127.0.0.1:3000:3000 \
            --shm-size=1g \
            prerenderbuddy/engine:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs engine
          exit 1
