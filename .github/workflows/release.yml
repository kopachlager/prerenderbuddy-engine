name: Tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  tagged-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm

      - name: Validate tag and release metadata
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node --print "require('./package.json').version")"
          test "$version" = "$package_version"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Reconstruct tagged source archive
        id: archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact="${RUNNER_TEMP}/prerenderbuddy-engine-${version}.tar.gz"
          source_dir="${RUNNER_TEMP}/source"
          mkdir -p "$source_dir"
          git archive \
            --format=tar.gz \
            --prefix="prerenderbuddy-engine-${version}/" \
            --output="$artifact" \
            "$GITHUB_REF_NAME"
          tar -xzf "$artifact" -C "$source_dir"
          compose_asset="${RUNNER_TEMP}/docker-compose.yml"
          env_asset="${RUNNER_TEMP}/prerenderbuddy.env.example"
          cp "$source_dir/prerenderbuddy-engine-$version/docker-compose.yml" "$compose_asset"
          cp "$source_dir/prerenderbuddy-engine-$version/.env.example" "$env_asset"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "source_dir=$source_dir/prerenderbuddy-engine-$version" >> "$GITHUB_OUTPUT"
          echo "compose_asset=$compose_asset" >> "$GITHUB_OUTPUT"
          echo "env_asset=$env_asset" >> "$GITHUB_OUTPUT"

      - name: Test clean tagged source
        working-directory: ${{ steps.archive.outputs.source_dir }}
        run: |
          test ! -e .git
          npm ci
          npm test
          npm audit --audit-level=moderate

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and run real Chromium fixtures
        working-directory: ${{ steps.archive.outputs.source_dir }}
        run: |
          docker build --target test --tag prerenderbuddy/engine:release-test .
          docker run --rm --shm-size=1g prerenderbuddy/engine:release-test

      - name: Build and smoke-test runtime image
        working-directory: ${{ steps.archive.outputs.source_dir }}
        run: |
          token="$(node -e "process.stdout.write('x'.repeat(32))")"
          trap 'docker rm --force engine-release-smoke >/dev/null 2>&1 || true' EXIT
          docker build --target runtime --tag prerenderbuddy/engine:release .
          docker run --detach --name engine-release-smoke \
            --env PRERENDER_TOKEN="$token" \
            --env ALLOWED_DOMAINS=example.com \
            --publish 127.0.0.1:3000:3000 \
            --shm-size=1g \
            prerenderbuddy/engine:release
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs engine-release-smoke
          exit 1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.archive.outputs.source_dir }}
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            ENGINE_VERSION=${{ steps.archive.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Verify public container platforms
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        shell: bash
        run: |
          image_path="${IMAGE#ghcr.io/}"
          registry_token="$(curl --fail --silent \
            "https://ghcr.io/token?scope=repository:${image_path%:*}:pull" | jq -r '.token')"
          test -n "$registry_token"
          manifest="$(curl --fail --silent \
            --header "Authorization: Bearer $registry_token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/${image_path%:*}/manifests/${image_path##*:}")"
          jq --exit-status '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | contains(["amd64", "arm64"])
          ' <<< "$manifest" >/dev/null

      - name: Create SBOM and checksums
        id: checksum
        working-directory: ${{ steps.archive.outputs.source_dir }}
        shell: bash
        run: |
          sbom_file="${RUNNER_TEMP}/prerenderbuddy-engine-${{ steps.archive.outputs.version }}.spdx.json"
          npm sbom --sbom-format spdx > "$sbom_file"
          checksum_file="${RUNNER_TEMP}/SHA256SUMS"
          cd "$(dirname "${{ steps.archive.outputs.artifact }}")"
          sha256sum \
            "$(basename "${{ steps.archive.outputs.artifact }}")" \
            "$(basename "$sbom_file")" \
            "$(basename "${{ steps.archive.outputs.compose_asset }}")" \
            "$(basename "${{ steps.archive.outputs.env_asset }}")" > "$checksum_file"
          echo "file=$checksum_file" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom_file" >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.archive.outputs.artifact }}
            ${{ steps.checksum.outputs.sbom }}

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.archive.outputs.artifact }}" \
            "${{ steps.checksum.outputs.sbom }}" \
            "${{ steps.checksum.outputs.file }}" \
            "${{ steps.archive.outputs.compose_asset }}" \
            "${{ steps.archive.outputs.env_asset }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Prerender Buddy Engine ${{ steps.archive.outputs.version }} alpha" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
