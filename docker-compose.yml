services:
  engine:
    build:
      context: .
    image: prerenderbuddy/engine:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${ENGINE_PORT:-3000}:3000"
    shm_size: "1gb"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
